<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>Up and Down</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#f5f5f5;
    overflow:hidden;
}

#gameContainer{
    width:100vw;
    height:100vh;
    background:white;
    border:8px solid #f4c400;
    position:relative;
    overflow:hidden;
}

/* Splash Screen */

#splash{
    position:absolute;
    inset:0;
    background:white;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:999;
}

.logoOnly{
    width:240px;
    max-width:70%;
}

/* Top Bar */

#topBar{
    width:100%;
    padding:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#fff8d6;
    border-bottom:3px solid #f4c400;
}

#title{
    background:#f4c400;
    padding:10px 20px;
    border-radius:15px;
    font-size:24px;
    font-weight:bold;
    color:#333;
}

.topInfo{
    font-size:18px;
    font-weight:bold;
}

button{
    padding:8px 14px;
    border:none;
    border-radius:10px;
    background:#f4c400;
    font-weight:bold;
    cursor:pointer;
    margin-left:5px;
}

#questionArea{
    padding:20px;
    text-align:center;
}

#questionText{
    font-size:30px;
    color:#333;
    margin-bottom:15px;
}

#imageArea{
    width:100%;
    height:65vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

.scene{
    position:relative;
    width:100%;
    height:100%;
}

.scene img{
    width:100%;
    height:100%;
    object-fit:contain;
}

.option{
    position:absolute;
    cursor:pointer;
    transition:0.3s;
}

.correctCircle{
    border:8px solid green;
    border-radius:50%;
}

.wrongCircle{
    border:8px solid red;
    border-radius:50%;
}

.glow{
    animation:glow 1s infinite;
}

@keyframes glow{
    0%{box-shadow:0 0 5px gold;}
    50%{box-shadow:0 0 25px gold;}
    100%{box-shadow:0 0 5px gold;}
}

#feedback{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    font-size:45px;
    font-weight:bold;
    z-index:100;
    display:none;
}

.confetti{
    position:absolute;
    width:12px;
    height:12px;
    border-radius:50%;
    animation:fall 3s linear forwards;
}

@keyframes fall{

    0%{
        transform:translateY(-100px) rotate(0deg);
        opacity:1;
    }

    100%{
        transform:translateY(100vh) rotate(720deg);
        opacity:0;
    }
}

#endScreen{
    position:absolute;
    inset:0;
    background:white;
    display:none;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    z-index:500;
}

#endScreen h1{
    font-size:50px;
    color:#28a745;
    margin-bottom:20px;
}

#endScreen p{
    font-size:28px;
    margin-bottom:20px;
}

@media(max-width:768px){

    #questionText{
        font-size:22px;
    }

    #title{
        font-size:18px;
        padding:8px 14px;
    }

    .topInfo{
        font-size:14px;
    }

    #imageArea{
        height:60vh;
    }

    #endScreen h1{
        font-size:34px;
    }

    #endScreen p{
        font-size:22px;
    }

    .logoOnly{
        width:180px;
    }
}

</style>
</head>

<body>

<div id="gameContainer">

    <!-- Splash Screen -->

    <div id="splash">
        <img src="assets/innovinelogo.png" alt="logo" class="logoOnly">
    </div>

    <!-- Top Bar -->

    <div id="topBar">

        <div id="title">Up and Down</div>

        <div class="topInfo">
            Score: <span id="score">0</span>/8
        </div>

        <div>
            <button onclick="toggleMute()" id="muteBtn">Mute</button>
            <button onclick="restartGame()">Restart</button>
        </div>

    </div>

    <!-- Question -->

    <div id="questionArea">
        <div id="questionText"></div>
    </div>

    <!-- Image Area -->

    <div id="imageArea">
        <div class="scene" id="scene"></div>
    </div>

    <!-- Feedback -->

    <div id="feedback"></div>

    <!-- End Screen -->

    <div id="endScreen">

        <h1>Great Job!</h1>

        <p>You have done a great job!</p>

        <p>Your Score: <span id="finalScore"></span>/8</p>

        <button onclick="restartGame()">Play Again</button>

    </div>

</div>

<!-- Sounds -->

<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="clapSound" src="assets/claps.mp3"></audio>

<script>

let currentQuestion = 0;
let score = 0;
let wrongAttempts = 0;
let muted = false;

const questions = [

{
question:"Tap the aeroplane flying up in the sky",
background:"assets/aeroplane and car.png",
options:[
{left:"15%", top:"10%", width:"25%", correct:true},
{left:"55%", top:"55%", width:"25%", correct:false}
]
},

{
question:"Tap the bird on the ground",
background:"assets/birds.png",
options:[
{left:"20%", top:"15%", width:"20%", correct:false},
{left:"60%", top:"65%", width:"20%", correct:true}
]
},

{
question:"Tap the cat on the roof",
background:"assets/catdog.png",
options:[
{left:"25%", top:"15%", width:"20%", correct:true},
{left:"60%", top:"65%", width:"20%", correct:false}
]
},

{
question:"Tap the girl coming down",
background:"assets/lift.png",
options:[
{left:"20%", top:"20%", width:"22%", correct:false},
{left:"60%", top:"45%", width:"22%", correct:true}
]
},

{
question:"Tap the lift going up",
background:"assets/elevator.png",
options:[
{left:"20%", top:"50%", width:"25%", correct:false},
{left:"60%", top:"15%", width:"25%", correct:true}
]
},

{
question:"Tap the child who is down on the seesaw",
background:"assets/seasaw.png",
options:[
{left:"20%", top:"60%", width:"22%", correct:true},
{left:"60%", top:"20%", width:"22%", correct:false}
]
},

{
question:"Tap the boy who is climbing the slide",
background:"assets/slide.png",
options:[
{left:"20%", top:"20%", width:"20%", correct:true},
{left:"60%", top:"50%", width:"20%", correct:false}
]
},

{
question:"Tap the downside of the weighting scale",
background:"assets/weightingscale.png",
options:[
{left:"18%", top:"55%", width:"25%", correct:true},
{left:"60%", top:"25%", width:"25%", correct:false}
]
}

];

setTimeout(()=>{

    document.getElementById("splash").style.display="none";

    loadQuestion();

},5000);

function loadQuestion(){

    if(currentQuestion >= questions.length){

        endGame();

        return;
    }

    wrongAttempts = 0;

    const q = questions[currentQuestion];

    document.getElementById("questionText").innerText = q.question;

    const scene = document.getElementById("scene");

    scene.innerHTML = `
        <img src="${q.background}">
    `;

    q.options.forEach((opt,index)=>{

        const div = document.createElement("div");

        div.className = "option";

        div.style.left = opt.left;
        div.style.top = opt.top;
        div.style.width = opt.width;
        div.style.height = "22%";

        div.onclick = ()=>checkAnswer(div,opt.correct);

        scene.appendChild(div);

    });

}

function checkAnswer(element,correct){

    const options = document.querySelectorAll(".option");

    options.forEach(o=>o.style.pointerEvents="none");

    if(correct){

        element.classList.add("correctCircle");

        score++;

        document.getElementById("score").innerText = score;

        playSound("correctSound");

        showFeedback("Correct!","green");

        createConfetti();

        setTimeout(()=>{

            currentQuestion++;

            loadQuestion();

        },1500);

    }else{

        wrongAttempts++;

        element.classList.add("wrongCircle");

        playSound("wrongSound");

        if(wrongAttempts === 1){

            showFeedback("Try Again!","red");

            const correctOption = [...options].find((o,i)=>
                questions[currentQuestion].options[i].correct
            );

            correctOption.classList.add("glow");

            setTimeout(()=>{

                options.forEach(o=>{

                    o.style.pointerEvents="auto";

                });

            },1200);

        }else{

            showFeedback("Correct Answer","orange");

            const correctOption = [...options].find((o,i)=>
                questions[currentQuestion].options[i].correct
            );

            correctOption.classList.add("correctCircle");

            setTimeout(()=>{

                currentQuestion++;

                loadQuestion();

            },1500);
        }
    }
}

function showFeedback(text,color){

    const feedback = document.getElementById("feedback");

    feedback.innerText = text;

    feedback.style.color = color;

    feedback.style.display = "block";

    setTimeout(()=>{

        feedback.style.display = "none";

    },1000);
}

function createConfetti(){

    for(let i=0;i<50;i++){

        const conf = document.createElement("div");

        conf.className = "confetti";

        conf.style.left = Math.random()*100 + "vw";

        conf.style.background =
            `hsl(${Math.random()*360},100%,50%)`;

        conf.style.animationDuration =
            (Math.random()*2+2)+"s";

        document.body.appendChild(conf);

        setTimeout(()=>{

            conf.remove();

        },3000);
    }
}

function playSound(id){

    if(muted) return;

    const sound = document.getElementById(id);

    sound.currentTime = 0;

    sound.play();
}

function toggleMute(){

    muted = !muted;

    document.getElementById("muteBtn").innerText =
        muted ? "Unmute" : "Mute";
}

function endGame(){

    document.getElementById("endScreen").style.display="flex";

    document.getElementById("finalScore").innerText = score;

    playSound("clapSound");

    createConfetti();
}

function restartGame(){

    currentQuestion = 0;

    score = 0;

    document.getElementById("score").innerText = "0";

    document.getElementById("endScreen").style.display = "none";

    loadQuestion();
}

</script>

</body>
</html>
