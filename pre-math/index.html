<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Up and Down</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    overflow:hidden;
}

#gameContainer{
    width:100vw;
    height:100vh;
    background:white;
    border:8px solid #f4c400;
    position:relative;
    overflow:hidden;
}

/* Splash */

#splash{
    position:absolute;
    inset:0;
    background:white;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:999;
}

.logoOnly{
    width:220px;
    max-width:70%;
}

/* Top Bar */

#topBar{
    width:100%;
    padding:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#fff8d6;
    border-bottom:3px solid #f4c400;
}

#title{
    background:#f4c400;
    padding:10px 20px;
    border-radius:15px;
    font-size:24px;
    font-weight:bold;
}

.topInfo{
    font-size:18px;
    font-weight:bold;
}

button{
    padding:8px 14px;
    border:none;
    border-radius:10px;
    background:#f4c400;
    font-weight:bold;
    cursor:pointer;
    margin-left:5px;
}

/* Question */

#questionArea{
    padding:15px;
    text-align:center;
}

#questionText{
    font-size:32px;
    margin-bottom:10px;
    color:#333;
}

/* Image Area */

#imageArea{
    width:100%;
    height:70vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.scene{
    position:relative;
    width:100%;
    height:100%;
}

.scene img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
}

/* Click Areas */

.option{
    position:absolute;
    cursor:pointer;
    background:transparent;
    border-radius:50%;
}

/* Green Circle */

.correctCircle{
    border:8px solid #00c853;
    border-radius:50%;
    animation:pop .4s ease;
}

@keyframes pop{

    0%{
        transform:scale(0.5);
    }

    100%{
        transform:scale(1);
    }
}

/* Glow */

.glow{
    animation:glow 1s infinite;
}

@keyframes glow{

    0%{
        box-shadow:0 0 5px gold;
    }

    50%{
        box-shadow:0 0 25px gold;
    }

    100%{
        box-shadow:0 0 5px gold;
    }
}

/* Feedback */

#feedback{
    position:absolute;
    top:45%;
    left:50%;
    transform:translate(-50%,-50%);
    font-size:50px;
    font-weight:bold;
    z-index:100;
    display:none;
}

/* Confetti */

.confetti{
    position:absolute;
    width:12px;
    height:12px;
    border-radius:50%;
    animation:fall 3s linear forwards;
}

@keyframes fall{

    0%{
        transform:translateY(-100px) rotate(0deg);
        opacity:1;
    }

    100%{
        transform:translateY(100vh) rotate(720deg);
        opacity:0;
    }
}

/* End Screen */

#endScreen{
    position:absolute;
    inset:0;
    background:white;
    display:none;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:500;
    text-align:center;
}

#endScreen h1{
    font-size:50px;
    color:#28a745;
    margin-bottom:20px;
}

#endScreen p{
    font-size:28px;
    margin-bottom:20px;
}

/* Mobile */

@media(max-width:768px){

    #questionText{
        font-size:22px;
    }

    #title{
        font-size:18px;
        padding:8px 14px;
    }

    .topInfo{
        font-size:14px;
    }

    #imageArea{
        height:62vh;
    }

    .correctCircle{
        border:5px solid #00c853;
    }

}

</style>
</head>

<body>

<div id="gameContainer">

    <!-- Splash -->

    <div id="splash">
        <img src="media/innovinelogo.png" class="logoOnly">
    </div>

    <!-- Top Bar -->

    <div id="topBar">

        <div id="title">Up and Down</div>

        <div class="topInfo">
            Score: <span id="score">0</span>/8
        </div>

        <div>
            <button onclick="toggleMute()" id="muteBtn">Mute</button>
            <button onclick="restartGame()">Restart</button>
        </div>

    </div>

    <!-- Question -->

    <div id="questionArea">
        <div id="questionText"></div>
    </div>

    <!-- Image Area -->

    <div id="imageArea">
        <div class="scene" id="scene"></div>
    </div>

    <!-- Feedback -->

    <div id="feedback"></div>

    <!-- End Screen -->

    <div id="endScreen">

        <h1>Great Job!</h1>

        <p>You did amazing!</p>

        <p>Your Score: <span id="finalScore"></span>/8</p>

        <button onclick="restartGame()">Play Again</button>

    </div>

</div>

<!-- Sounds -->

<audio id="correctSound" src="media/correct.mp3"></audio>
<audio id="wrongSound" src="media/wrong.mp3"></audio>
<audio id="clapSound" src="media/claps.mp3"></audio>

<script>

let currentQuestion = 0;
let score = 0;
let muted = false;

/* Questions */

const questions = [

{
question:"Tap the object UP in the sky",
background:"media/aeroplane and car.png",
options:[
{
left:"14%",
top:"4%",
width:"62%",
height:"30%",
correct:true
},
{
left:"22%",
top:"60%",
width:"46%",
height:"22%",
correct:false
}
]
},

{
question:"Tap the bird DOWN on the ground",
background:"media/birds.png",
options:[
{
left:"10%",
top:"10%",
width:"28%",
height:"28%",
correct:false
},
{
left:"45%",
top:"66%",
width:"18%",
height:"18%",
correct:true
}
]
},

{
question:"Tap the animal UP on the roof",
background:"media/catdog.png",
options:[
{
left:"60%",
top:"6%",
width:"18%",
height:"18%",
correct:true
},
{
left:"8%",
top:"66%",
width:"18%",
height:"18%",
correct:false
}
]
},

{
question:"Tap the girl coming DOWN",
background:"media/lift.png",
options:[
{
left:"10%",
top:"12%",
width:"24%",
height:"34%",
correct:false
},
{
left:"56%",
top:"38%",
width:"24%",
height:"34%",
correct:true
}
]
},

{
question:"Tap the lift going UP",
background:"media/elevator.png",
options:[
{
left:"12%",
top:"45%",
width:"26%",
height:"40%",
correct:false
},
{
left:"54%",
top:"2%",
width:"26%",
height:"40%",
correct:true
}
]
},

{
question:"Tap the child DOWN",
background:"media/seasaw.png",
options:[
{
left:"56%",
top:"44%",
width:"24%",
height:"30%",
correct:true
},
{
left:"8%",
top:"10%",
width:"24%",
height:"30%",
correct:false
}
]
},

{
question:"Tap the boy sliding DOWN",
background:"media/slide.png",
options:[
{
left:"4%",
top:"48%",
width:"34%",
height:"34%",
correct:true
},
{
left:"62%",
top:"8%",
width:"24%",
height:"34%",
correct:false
}
]
},

{
question:"Tap the side that is DOWN",
background:"media/weightingscale.png",
options:[
{
left:"8%",
top:"48%",
width:"28%",
height:"30%",
correct:true
},
{
left:"66%",
top:"18%",
width:"18%",
height:"22%",
correct:false
}
]
}

];

/* Splash */

setTimeout(()=>{

    document.getElementById("splash").style.display = "none";

    loadQuestion();

},3000);

/* Load Question */

function loadQuestion(){

    if(currentQuestion >= questions.length){

        endGame();

        return;
    }

    const q = questions[currentQuestion];

    document.getElementById("questionText").innerText = q.question;

    const scene = document.getElementById("scene");

    scene.innerHTML = `<img src="${q.background}" draggable="false">`;

    q.options.forEach((opt)=>{

        const div = document.createElement("div");

        div.className = "option";

        div.style.left = opt.left;
        div.style.top = opt.top;
        div.style.width = opt.width;
        div.style.height = opt.height;

        div.onclick = ()=>{

            checkAnswer(div,opt.correct);

        };

        scene.appendChild(div);

    });

}

/* Check Answer */

function checkAnswer(element,correct){

    const options = document.querySelectorAll(".option");

    if(correct){

        options.forEach(o=>{

            o.style.pointerEvents = "none";

        });

        element.classList.add("correctCircle");

        score++;

        document.getElementById("score").innerText = score;

        playSound("correctSound");

        setTimeout(()=>{

            playSound("clapSound");

        },300);

        showFeedback("Great Job!","#00c853");

        createConfetti();

        setTimeout(()=>{

            currentQuestion++;

            loadQuestion();

        },1800);

    }else{

        playSound("wrongSound");

        element.classList.add("glow");

        showFeedback("Try Again!","red");

        setTimeout(()=>{

            element.classList.remove("glow");

        },1000);

    }

}

/* Feedback */

function showFeedback(text,color){

    const feedback = document.getElementById("feedback");

    feedback.innerText = text;

    feedback.style.color = color;

    feedback.style.display = "block";

    setTimeout(()=>{

        feedback.style.display = "none";

    },1000);

}

/* Confetti */

function createConfetti(){

    for(let i=0;i<50;i++){

        const conf = document.createElement("div");

        conf.className = "confetti";

        conf.style.left = Math.random()*100 + "vw";

        conf.style.background =
        `hsl(${Math.random()*360},100%,50%)`;

        conf.style.animationDuration =
        (Math.random()*2+2)+"s";

        document.body.appendChild(conf);

        setTimeout(()=>{

            conf.remove();

        },3000);

    }

}

/* Sound */

function playSound(id){

    if(muted) return;

    const sound = document.getElementById(id);

    sound.currentTime = 0;

    sound.play();

}

/* Mute */

function toggleMute(){

    muted = !muted;

    document.getElementById("muteBtn").innerText =
    muted ? "Unmute" : "Mute";

}

/* End Game */

function endGame(){

    document.getElementById("endScreen").style.display = "flex";

    document.getElementById("finalScore").innerText = score;

    playSound("clapSound");

    createConfetti();

}

/* Restart */

function restartGame(){

    currentQuestion = 0;

    score = 0;

    document.getElementById("score").innerText = "0";

    document.getElementById("endScreen").style.display = "none";

    loadQuestion();

}

</script>

</body>
</html>
